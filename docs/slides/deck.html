<title>SKYFORGE Mission Deck</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one full-bleed 3D sea world. Notes are set directly on the footage like documentary titles:
   no panels, a soft scrim at the left edge, type carried by shadow. Telemetry is hairline instrument text. */
:root{
  --abyss:#06121c;        /* night sea, page ground */
  --ink:#fbf6ee;          /* titles: warm ivory, like paper under work light */
  --text:#ece6dd;         /* running text on footage */
  --dim:#b3c2bf;          /* secondary: sea-glass */
  --rescue:#ff7a33;       /* rescue orange, the single accent */
  --sonar:#5fe0d2;        /* sensor data */
  --hazard:#ff4d57;
  --ok:#8be39a;
  --hair:rgba(233,241,244,.28);
  --serif:'Newsreader', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --sans:'Hanken Grotesk', 'Segoe UI', Roboto, Arial, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(0,8,14,.75), 0 0 18px rgba(0,8,14,.55);
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--abyss);color:var(--text);font-family:var(--sans);overflow:hidden}
#gl,#ov{position:fixed;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
#scrim{position:fixed;inset:0;pointer-events:none;transition:opacity .5s ease;
  background:linear-gradient(90deg, rgba(3,10,16,.62) 0%, rgba(3,10,16,.38) 26%, rgba(3,10,16,0) 46%),
             radial-gradient(ellipse 30% 44% at 100% 0%, rgba(3,10,16,.72) 0%, rgba(3,10,16,.35) 55%, rgba(3,10,16,0) 100%),
             linear-gradient(0deg, rgba(3,10,16,.45) 0%, rgba(3,10,16,0) 22%)}
body.notes-off #scrim{opacity:.0}
#fade{position:fixed;inset:0;background:var(--abyss);opacity:0;pointer-events:none;transition:opacity .45s ease}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--abyss);z-index:50;font-family:var(--mono);color:var(--dim);letter-spacing:.12em;font-size:12px;text-transform:uppercase}
#loading b{display:block;font-family:var(--serif);font-weight:400;font-size:64px;letter-spacing:-.01em;text-transform:none;color:var(--ink);text-align:center;margin-bottom:8px}
.stage{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,440px) 1fr minmax(0,230px);grid-template-rows:1fr auto;gap:16px;
  padding-block:24px 16px;padding-left:max(28px, env(safe-area-inset-left, 0px));padding-right:max(24px, env(safe-area-inset-right, 0px));pointer-events:none}
.card{grid-column:1;grid-row:1;align-self:end;pointer-events:auto;min-width:0;max-height:calc(100% - 8px);overflow:auto;scrollbar-width:none;
  text-shadow:var(--shadow);padding-bottom:6px;transition:opacity .45s ease, transform .45s ease}
.card::-webkit-scrollbar{display:none}
body.notes-off .card{opacity:0;transform:translateY(10px);pointer-events:none}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--g2);display:flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:30px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--g1),var(--g3))}
.eyebrow .act{color:var(--dim)}
.card h1{font-family:var(--serif);font-optical-sizing:auto;font-weight:400;font-size:clamp(34px,3.7vw,56px);line-height:1.02;letter-spacing:-.015em;margin:12px 0 14px;text-wrap:balance;color:var(--ink)}
.card h1 em{font-style:italic;background:linear-gradient(100deg,var(--g1) 0%,var(--g2) 55%,var(--g3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 1px 1px rgba(0,8,14,.7)) drop-shadow(0 0 10px rgba(0,8,14,.45));padding-right:.08em}
/* act palettes, each taken from its own scene */
body{--g1:#ffe2b0;--g2:#ff9a4d;--g3:#ff6a3d}
body[data-act="Launch"]{--g1:#ffe9c2;--g2:#ffb066;--g3:#ff7a45}      /* dawn over the pad */
body[data-act="Search"]{--g1:#c9fff6;--g2:#5fe0d2;--g3:#4aa3ff}      /* sonar sweep */
body[data-act="Understand"]{--g1:#fff6b0;--g2:#ff9b3d;--g3:#d6407f}  /* ironbow thermal ramp */
body[data-act="Decide"]{--g1:#fff0c2;--g2:#ffb35c;--g3:#ff6f91}      /* scored candidates */
body[data-act="Act"]{--g1:#ffe08a;--g2:#ff8a3d;--g3:#ff5a2a}         /* sea dye */
body[data-act="Survive"]{--g1:#ffd18a;--g2:#ff7a59;--g3:#ff4d6d}     /* fault red */
body[data-act="Machine"]{--g1:#ffffff;--g2:#c3dbe6;--g3:#7fb1c9}     /* composite and carbon */
body[data-act="Return"]{--g1:#ffd2b0;--g2:#ff9a8a;--g3:#c47bff}      /* dusk */
.card p{font-size:15.5px;line-height:1.55;color:var(--text);margin:0 0 10px;max-width:58ch}
.card ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:9px;max-width:58ch}
.card li{font-size:14.5px;line-height:1.48;color:var(--text);padding-left:14px;border-left:2px solid transparent;border-image:linear-gradient(180deg,var(--g1),var(--g3)) 1}
.card li b{color:var(--g1);font-weight:600}
.tags{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--g2);margin-top:10px;line-height:1.7}
.tbl{width:100%;max-width:58ch;border-collapse:collapse;font-size:13.5px;margin-top:8px;font-variant-numeric:tabular-nums}
.tbl td{padding:6px 8px 6px 0;border-bottom:1px solid rgba(233,241,244,.16);vertical-align:top;color:var(--text)}
.tbl td:first-child{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;padding-top:8px}
.formula{font-family:var(--mono);font-size:12.5px;color:var(--g1);border-left:2px solid var(--g2);padding:2px 0 2px 12px;margin:10px 0;line-height:1.7;max-width:58ch;overflow-wrap:anywhere}
.small{font-size:13px!important;color:var(--dim)!important}
.hud{grid-column:3;grid-row:1;align-self:start;pointer-events:none;font-family:var(--mono);font-size:11px;text-shadow:0 0 6px rgba(2,8,14,.95),0 1px 2px rgba(2,8,14,.9);min-width:0;padding:8px 10px;margin:-8px -10px 0 0;border-radius:6px;background:rgba(4,12,20,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hud h4{margin:0 0 6px;padding-bottom:6px;font-weight:500;font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;display:flex;justify-content:space-between;border-bottom:1px solid var(--hair)}
.hud .row{display:flex;justify-content:space-between;gap:10px;padding:2.5px 0;font-variant-numeric:tabular-nums}
.hud .row span:first-child{color:var(--dim)}
.hud .row span:last-child{color:var(--ink)}
.hud .warn{color:var(--hazard)!important}.hud .good{color:var(--ok)!important}.hud .acc{color:var(--g2)!important}
.rail{grid-column:1 / -1;grid-row:2;display:flex;align-items:center;gap:14px;pointer-events:auto;font-family:var(--mono);font-size:11px;color:var(--dim);text-shadow:var(--shadow)}
.rail button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--hair);border-radius:999px;padding:6px 13px;cursor:pointer;letter-spacing:.08em;text-shadow:none}
.rail button:hover{border-color:var(--g2);color:var(--g2)}
.rail button[aria-pressed="false"]{color:var(--dim)}
.rail button:focus-visible{outline:2px solid var(--rescue);outline-offset:2px}
.ticks{flex:1;display:flex;gap:3px;min-width:0}
.ticks i{flex:1;height:3px;background:rgba(233,241,244,.22);border-radius:2px;cursor:pointer;pointer-events:auto}
.ticks i.on{background:linear-gradient(90deg,var(--g1),var(--g3))}.ticks i.done{background:rgba(255,226,190,.42)}
.count{min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.actname{min-width:140px;text-transform:uppercase;letter-spacing:.12em}
.card.enter > *{animation:lineIn .8s cubic-bezier(.2,.8,.2,1) both}
.card.enter > *:nth-child(2){animation-delay:.06s}.card.enter > *:nth-child(3){animation-delay:.14s}.card.enter > *:nth-child(4){animation-delay:.2s}.card.enter > *:nth-child(5){animation-delay:.26s}
@keyframes lineIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.card.enter > *{animation:none}#fade,.card,#scrim{transition:none}}
@media (max-width: 820px){
  #scrim{background:linear-gradient(0deg, rgba(3,10,16,.72) 0%, rgba(3,10,16,.45) 38%, rgba(3,10,16,0) 62%), linear-gradient(180deg, rgba(3,10,16,.5) 0%, rgba(3,10,16,0) 18%)}
  .stage{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;padding-block:12px 10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));gap:10px}
  .hud{grid-column:1;grid-row:1;display:grid;grid-template-columns:1fr 1fr;column-gap:14px;font-size:10px}
  .hud h4{grid-column:1 / -1}
  .card{grid-column:1;grid-row:2;align-self:end;max-height:50vh}
  .card h1{font-size:31px}
  .card p{font-size:14.5px}
  .rail{grid-row:3}.actname{display:none}
}
</style>

<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="scrim"></div>
<div id="fade"></div>
<div class="stage">
  <section class="card" id="card" aria-live="polite"></section>
  <aside class="hud" id="hud" aria-label="Live telemetry"></aside>
  <nav class="rail" aria-label="Slides">
    <button id="prev" aria-label="Previous slide">◀ PREV</button>
    <span class="actname" id="actname"></span>
    <div class="ticks" id="ticks"></div>
    <span class="count" id="count"></span>
    <button id="notes" aria-pressed="true" title="Show or hide the notes (N)">NOTES</button>
    <button id="next" aria-label="Next slide">NEXT ▶</button>
  </nav>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DTMAX = window.__DTMAX || 0.05;
const $ = s => document.querySelector(s);
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const lerp = (a,b,t)=>a+(b-a)*t;
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const smooth = (a,b,t)=>{const u=clamp((t-a)/(b-a),0,1);return u*u*(3-2*u)};
const V = (x,y,z)=>new THREE.Vector3(x,y,z);

/* ---------------------------------------------------------------- renderer + world */
const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.55;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 6000);
const ov = $('#ov'), g2 = ov.getContext('2d');

const sky = new Sky(); sky.scale.setScalar(5000); scene.add(sky);
const su = sky.material.uniforms;
su.turbidity.value=6; su.rayleigh.value=1.6; su.mieCoefficient.value=0.004; su.mieDirectionalG.value=0.86;
const sunDir = new THREE.Vector3();
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT=null;
const skyScene = new THREE.Scene(); const sky2 = new Sky(); sky2.scale.setScalar(5000); skyScene.add(sky2);
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x0b2233, 0.6); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe2b8, 2.2); scene.add(sun);
scene.fog = new THREE.FogExp2(0x9fb6c4, 0.0016);

const SKIES = { // elevation deg, azimuth deg, horizon col, zenith col, sun colour, exposure
  dawn:{el:3.2,az:205,hor:[.95,.62,.45],zen:[.18,.28,.45],sun:0xffb070,exp:.52,fog:0xb79a8e},
  day:{el:28,az:200,hor:[.72,.82,.9],zen:[.22,.42,.68],sun:0xfff2dc,exp:.42,fog:0xa8c0cf},
  dusk:{el:1.6,az:250,hor:[.98,.5,.32],zen:[.12,.16,.32],sun:0xff8a4a,exp:.6,fog:0x8b6f78},
  studio:{el:12,az:160,hor:[.35,.42,.52],zen:[.06,.1,.18],sun:0xdfe9ff,exp:.55,fog:0x22313f},
};
let skyNow = null, skyTarget = 'dawn', skyBlend = 1, skyFrom = null;
function skyParams(k){const s=SKIES[k];return {el:s.el,az:s.az,hor:s.hor.slice(),zen:s.zen.slice(),sun:new THREE.Color(s.sun),exp:s.exp,fog:new THREE.Color(s.fog)}}
function mixSky(a,b,t){return {el:lerp(a.el,b.el,t),az:lerp(a.az,b.az,t),hor:a.hor.map((v,i)=>lerp(v,b.hor[i],t)),zen:a.zen.map((v,i)=>lerp(v,b.zen[i],t)),sun:a.sun.clone().lerp(b.sun,t),exp:lerp(a.exp,b.exp,t),fog:a.fog.clone().lerp(b.fog,t)}}
function applySky(p, rebuildEnv){
  const phi = THREE.MathUtils.degToRad(90-p.el), th = THREE.MathUtils.degToRad(p.az);
  sunDir.setFromSphericalCoords(1, phi, th);
  su.sunPosition.value.copy(sunDir); sky2.material.uniforms.sunPosition.value.copy(sunDir);
  for (const k of ['turbidity','rayleigh','mieCoefficient','mieDirectionalG']) sky2.material.uniforms[k].value = su[k].value;
  sun.position.copy(sunDir).multiplyScalar(500); sun.color.copy(p.sun);
  renderer.toneMappingExposure = p.exp;
  scene.fog.color.copy(p.fog);
  water.material.uniforms.uSunDir.value.copy(sunDir);
  water.material.uniforms.uSunCol.value.copy(p.sun);
  water.material.uniforms.uHorizon.value.set(...p.hor);
  water.material.uniforms.uZenith.value.set(...p.zen);
  water.material.uniforms.uFogCol.value.copy(p.fog);
  if (rebuildEnv){ if(envRT) envRT.dispose(); envRT = pmrem.fromScene(skyScene); scene.environment = envRT.texture; }
}

/* ---------------------------------------------------------------- ocean */
const WAVES = [ // dirX, dirZ, amplitude m, wavelength m, speed factor
  [1.0, 0.35, 0.34, 26, 1.0], [0.55, 0.85, 0.2, 14, 1.0], [-0.45, 1.0, 0.11, 7.5, 1.0], [0.95,-0.35,0.05,3.6,1.0]];
const W4 = WAVES.map(([dx,dz,a,L,s])=>{const n=Math.hypot(dx,dz);const k=2*Math.PI/L;return [dx/n,dz/n,a,k,Math.sqrt(9.81*k)*s]});
function waveH(x,z,t){let h=0;for(const[dx,dz,a,k,w]of W4)h+=a*Math.sin((dx*x+dz*z)*k+w*t);return h}
function waveGrad(x,z,t){let gx=0,gz=0;for(const[dx,dz,a,k,w]of W4){const c=a*k*Math.cos((dx*x+dz*z)*k+w*t);gx+=dx*c;gz+=dz*c}return [gx,gz]}
const waterU = {
  uTime:{value:0}, uW:{value:W4.map(w=>new THREE.Vector4(w[0],w[1],w[2],w[3]))}, uWs:{value:W4.map(w=>w[4])},
  uSunDir:{value:new THREE.Vector3(0,1,0)}, uSunCol:{value:new THREE.Color(1,1,1)},
  uHorizon:{value:new THREE.Vector3(.8,.8,.9)}, uZenith:{value:new THREE.Vector3(.2,.4,.7)},
  uDeep:{value:new THREE.Color(0x07344c)}, uShallow:{value:new THREE.Color(0x167f8c)},
  uFogCol:{value:new THREE.Color(0x9fb6c4)}, uFogD:{value:0.0016}, uThermal:{value:0},
};
const water = new THREE.Mesh(new THREE.PlaneGeometry(2600,2600,380,380).rotateX(-Math.PI/2), new THREE.ShaderMaterial({
  uniforms: waterU,
  vertexShader:`
    uniform float uTime; uniform vec4 uW[4]; uniform float uWs[4];
    varying vec3 vW; varying vec3 vN; varying float vH;
    void main(){
      vec3 p = (modelMatrix*vec4(position,1.)).xyz; float h=0.; float gx=0.; float gz=0.;
      for(int i=0;i<4;i++){ vec4 w=uW[i]; float ph=(w.x*p.x+w.y*p.z)*w.w+uWs[i]*uTime; h+=w.z*sin(ph); float c=w.z*w.w*cos(ph); gx+=w.x*c; gz+=w.y*c; }
      p.y+=h; vH=h; vW=p; vN=normalize(vec3(-gx,1.,-gz));
      gl_Position=projectionMatrix*viewMatrix*vec4(p,1.);
    }`,
  fragmentShader:`
    uniform float uTime; uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uHorizon; uniform vec3 uZenith;
    uniform vec3 uDeep; uniform vec3 uShallow; uniform vec3 uFogCol; uniform float uFogD; uniform float uThermal;
    varying vec3 vW; varying vec3 vN; varying float vH;
    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
    vec2 dn(vec2 p){float e=.15;return vec2(noise(p+vec2(e,0))-noise(p-vec2(e,0)),noise(p+vec2(0,e))-noise(p-vec2(0,e)))/(2.*e);}
    void main(){
      vec2 q=vW.xz; vec2 d=dn(q*.35+vec2(uTime*.35,uTime*.2))*.55+dn(q*1.3-vec2(uTime*.6,-uTime*.4))*.25+dn(q*4.1+uTime*.9)*.08;
      vec3 n=normalize(vN+vec3(-d.x,0.,-d.y)*.6);
      vec3 v=normalize(cameraPosition-vW); float dist=length(cameraPosition-vW);
      float fr=.02+.98*pow(1.-max(dot(n,v),0.),5.);
      vec3 r=reflect(-v,n); vec3 skyc=mix(uHorizon,uZenith,clamp(r.y*1.6,0.,1.));
      float sp=pow(max(dot(r,normalize(uSunDir)),0.),320.)*6.+pow(max(dot(r,normalize(uSunDir)),0.),30.)*.25;
      vec3 body=mix(uDeep,uShallow,clamp(vH*.9+.4,0.,1.)*.5)+uZenith*.06;
      vec3 col=mix(body,skyc,fr)+uSunCol*sp;
      float foam=smoothstep(.5,.75,vH+noise(q*2.+uTime)*.12)*.18;
      float shore=smoothstep(30.,38.,vW.z)*(.55+.45*noise(q*1.5+uTime*.5));
      col=mix(col,vec3(.86,.92,.95),clamp(foam+shore,0.,1.));
      vec3 th=vec3(.06,.02,.16)+vec3(.05,.0,.12)*(vH+.4)+vec3(.0,.03,.06)*noise(q*.8);
      col=mix(col,th,uThermal);
      col=mix(col,mix(uFogCol,vec3(.03,.01,.08),uThermal),1.-exp(-dist*uFogD));
      gl_FragColor=vec4(col,1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
}));
water.frustumCulled = false;
scene.add(water);

/* ---------------------------------------------------------------- coast + base */
const PAD = V(0, 2.7, 60);
const coast = new THREE.Group(); scene.add(coast);
const sandM = new THREE.MeshStandardMaterial({color:0xc9b48e, roughness:.95});
const rockM = new THREE.MeshStandardMaterial({color:0x5b5650, roughness:.9, flatShading:true});
const concM = new THREE.MeshStandardMaterial({color:0x8d939a, roughness:.85});
{

const PATH=[]; // {x,z,s}
(function(){
  const xs=[-70,70], r=10; let s=0, prev=null;
  const push=(x,z)=>{ if(prev) s+=Math.hypot(x-prev.x,z-prev.z); prev={x,z}; PATH.push({x,z,s}); };
  MISSION.lanes.forEach((z,i)=>{
    const a=i%2?xs[1]:xs[0], b=i%2?xs[0]:xs[1];
    for(let k=0;k<=70;k++) push(lerp(a,b,k/70), z);
    if(i<MISSION.lanes.length-1){ const dir=i%2?-1:1; for(let k=1;k<12;k++){const th=Math.PI*k/12; push(b+dir*r*Math.sin(th), z-r+r*Math.cos(th));} }
  });
  PATH.total=s;
})();

function pathAt(s){
  s=((s%PATH.total)+PATH.total)%PATH.total;
  let lo=0,hi=PATH.length-1; while(hi-lo>1){const m=(lo+hi)>>1; if(PATH[m].s<s) lo=m; else hi=m;}
  const a=PATH[lo],b=PATH[hi],u=(s-a.s)/Math.max(1e-6,b.s-a.s);

function P(x,y,z){_v.set(x,y,z).project(camera); return {x:(_v.x*.5+.5)*W, y:(-_v.y*.5+.5)*H, ok:_v.z<1&&_v.z>-1}}
function ppm(x,z){const a=P(x,0,z),b=P(x+1,0,z);return Math.hypot(b.x-a.x,b.y-a.y)}
const C = {rescue:'#ff7a33', sonar:'#5fe0d2', hazard:'#ff4d57', foam:'#f3f6f5', mist:'#a9bcc6', ok:'#8be39a'};
const CLS_COL = {injured:C.rescue, mine:C.hazard, weapon:C.hazard, hostile_unit:C.hazard, warship:C.hazard, debris:'#e9d27a', vessel:C.sonar};
const CLS_TXT = {injured:'CASUALTY', mine:'MINE', weapon:'WEAPON', hostile_unit:'HOSTILE', warship:'WARSHIP', debris:'DEBRIS', vessel:'VESSEL'};
function mono(sz,w=500){g2.font=`${w} ${sz}px "IBM Plex Mono", ui-monospace, monospace`}
function label(x,y,txt,col,bg='rgba(4,12,20,.5)',sz=11){mono(sz,600);const w=g2.measureText(txt).width+10;g2.fillStyle=bg;g2.fillRect(x,y-sz-4,w,sz+8);g2.fillStyle=col;g2.fillText(txt,x+5,y+1);return w}
function dashCircle(x,z,r,col,fill,dash=[6,5],lw=1.5){const c=P(x,0,z), k=ppm(x,z)*r; g2.save(); g2.beginPath(); g2.arc(c.x,c.y,k,0,7);
  if(fill){g2.fillStyle=fill;g2.fill()} g2.setLineDash(dash); g2.strokeStyle=col; g2.lineWidth=lw; g2.stroke(); g2.restore(); return {c,k}}
function hatch(x,z,r,col){const {c,k}=dashCircle(x,z,r,col,'rgba(255,61,74,.08)'); g2.save(); g2.beginPath(); g2.arc(c.x,c.y,k,0,7); g2.clip(); g2.strokeStyle='rgba(255,61,74,.22)'; g2.lineWidth=1;
  for(let i=-k*2;i<k*2;i+=9){g2.beginPath();g2.moveTo(c.x+i,c.y-k);g2.lineTo(c.x+i+k,c.y+k);g2.stroke()} g2.restore();}
function corners(x,y,s,col,lw=2){const q=s*.32;g2.strokeStyle=col;g2.lineWidth=lw;g2.beginPath();
  for(const[sx,sy]of[[-1,-1],[1,-1],[1,1],[-1,1]]){g2.moveTo(x+sx*s,y+sy*s-sy*q);g2.lineTo(x+sx*s,y+sy*s);g2.lineTo(x+sx*s-sx*q,y+sy*s)}g2.stroke()}

/* ---------------------------------------------------------------- mission overlay layers */
function drawGrid(alpha=.18){
  g2.save(); g2.strokeStyle=`rgba(70,214,200,${alpha*.5})`; g2.lineWidth=1;
  for(let x=-120;x<=120;x+=20){const a=P(x,0,-120),b=P(x,0,-300);g2.beginPath();g2.moveTo(a.x,a.y);g2.lineTo(b.x,b.y);g2.stroke()}
  for(let z=-120;z>=-300;z-=20){const a=P(-120,0,z),b=P(120,0,z);g2.beginPath();g2.moveTo(a.x,a.y);g2.lineTo(b.x,b.y);g2.stroke()}
  mono(9.5); g2.fillStyle=`rgba(143,166,179,${alpha*3})`;
  for(let x=-100;x<=100;x+=40){const a=P(x,0,-128);g2.fillText(`${x>0?'+':''}${x} m E`,a.x+3,a.y-3)}
  g2.restore();
}
function drawLanes(){
  g2.save(); g2.setLineDash([3,7]); g2.strokeStyle='rgba(70,214,200,.55)'; g2.lineWidth=1.2; g2.beginPath();
  PATH.forEach((p,i)=>{const q=P(p.x,0,p.z); i?g2.lineTo(q.x,q.y):g2.moveTo(q.x,q.y)}); g2.stroke(); g2.restore();
}
function drawSwath(s){
  g2.save(); g2.lineCap='round'; g2.lineJoin='round';
  const w=ppm(0,-200)*28; g2.strokeStyle='rgba(70,214,200,.13)'; g2.lineWidth=w; g2.beginPath(); let started=false;
  for(const p of PATH){ if(p.s>s) break; const q=P(p.x,0,p.z); started?g2.lineTo(q.x,q.y):g2.moveTo(q.x,q.y); started=true; }
  const d=pathAt(s); const q=P(d.x,0,d.z); if(started){g2.lineTo(q.x,q.y); g2.stroke();}
  g2.restore();
}
function drawRadar(x,z,t){
  const c=P(x,0,z), k=ppm(x,z);
  for(let i=0;i<3;i++){const ph=((t*.6+i/3)%1); g2.beginPath(); g2.arc(c.x,c.y,ph*k*42,0,7); g2.strokeStyle=`rgba(70,214,200,${(1-ph)*.7})`; g2.lineWidth=1.5; g2.stroke();}
  // sweep
  const a=t*2.2; g2.save(); g2.translate(c.x,c.y); const gr=g2.createConicGradient(a,0,0); gr.addColorStop(0,'rgba(70,214,200,.28)'); gr.addColorStop(.12,'rgba(70,214,200,0)'); gr.addColorStop(1,'rgba(70,214,200,0)');
  g2.fillStyle=gr; g2.beginPath(); g2.arc(0,0,k*42,0,7); g2.fill(); g2.restore();
}
function drawDroneMark(x,z,yaw,name='SKYFORGE-1',col=C.rescue, sub='25 m AGL'){
  const c=P(x,MISSION.alt,z); g2.save(); g2.translate(c.x,c.y);
  const fwd=P(x-Math.sin(yaw)*5,MISSION.alt,z-Math.cos(yaw)*5); const ang=Math.atan2(fwd.y-c.y,fwd.x-c.x);
  g2.rotate(ang); g2.fillStyle=col; g2.beginPath(); g2.moveTo(13,0); g2.lineTo(-8,-8); g2.lineTo(-4,0); g2.lineTo(-8,8); g2.closePath(); g2.fill(); g2.restore();
  label(c.x+14,c.y-12,name,col); mono(9.5); g2.fillStyle=C.mist; g2.fillText(sub,c.x+19,c.y+8);
}
function drawDetections(s, opts={}){
  for(const e of E){
    if(e.detectS==null || e.detectS>s) continue;
    const age=(s-e.detectS)/SPEED; const p=e.obj.position; const c=P(p.x,p.y,p.z); if(!c.ok) continue;
    const col=CLS_COL[e.cls]; const conf = e.cls==='debris'?0.78: e.cls==='mine'?0.91: e.cls==='injured'?0.88:0.84;
    const hits=Math.min(5,1+Math.floor(age*3)), confirmed=hits>=3;
    if(opts.zones && confirmed && e.zone){ e.cls==='hostile_unit' ? dashCircle(p.x,p.z,e.zone,'rgba(255,61,74,.7)','rgba(255,61,74,.05)',[10,6],1.4) : hatch(p.x,p.z,e.zone,C.hazard); }
    const sz=Math.max(10, ppm(p.x,p.z)*(e.boat?6:2.4));
    const pop = clamp(age*3,0,1);
    g2.globalAlpha = confirmed?1:.55+.45*Math.sin(age*20);
    corners(c.x,c.y,sz*(1.6-pop*.6),col, confirmed?2:1.4);
    g2.globalAlpha=1;
    if(opts.labels!==false){
      const t=`${CLS_TXT[e.cls]} ${conf.toFixed(2)}`; label(c.x+sz+4,c.y-sz+8,t,col);
      if(opts.pos){mono(9.5);g2.fillStyle=C.mist;g2.fillText(`x ${p.x.toFixed(1)}  y ${(-p.z).toFixed(1)}`,c.x+sz+8,c.y-sz+24)}
      if(opts.kofn){ for(let i=0;i<5;i++){g2.beginPath();g2.arc(c.x+sz+9+i*8,c.y-sz+(opts.pos?36:24),2.6,0,7);g2.fillStyle=i<hits?col:'rgba(143,166,179,.35)';g2.fill()} }
    }
    if(opts.ray && age<1.2){ const d=pathAt(e.detectS+age*SPEED); const a=P(d.x,MISSION.alt,d.z); g2.save(); g2.setLineDash([2,4]); g2.strokeStyle=col; g2.globalAlpha=1-age/1.2; g2.beginPath(); g2.moveTo(a.x,a.y); g2.lineTo(c.x,c.y); g2.stroke(); g2.restore(); }
  }
}
function coverage(s){ return clamp(s/PATH.total,0,1); }

/* ---------------------------------------------------------------- simulation state helpers */
const S = { // live telemetry shown in the HUD
  phase:'INIT', alt:0, spd:0, bat:100, link:'UP', nav:'GNSS', dec:13, ref:3, extra:[]
};
let hudJitter=0;
function hudRows(){
  hudJitter+=1;
  const dec=(S.dec + Math.sin(hudJitter*.37)*1.6 + Math.sin(hudJitter*.11)*.8).toFixed(1);
  const ref=(S.ref + Math.sin(hudJitter*.53)*.4).toFixed(1);
  const rows=[['PHASE',S.phase,'acc'],['ALT AGL',`${S.alt.toFixed(1)} m`],['SPEED',`${S.spd.toFixed(1)} m/s`],['BATTERY',`${S.bat.toFixed(0)} %`, S.bat<30?'warn':''],
    ['LINK',S.link, S.link==='UP'?'good':'warn'],['NAV SOURCE',S.nav, S.nav==='GNSS'?'':'warn'],['DECISION p95',`${dec} ms`,'good'],['REFLEX p95',`${ref} ms`,'good'],...S.extra];
  return `<h4><span>SKYFORGE-1 · telemetry</span><span>SIM</span></h4>`+rows.map(([k,v,c])=>`<div class="row"><span>${k}</span><span class="${c||''}">${v}</span></div>`).join('');
}

  hud:t=>{const T=t%16; Object.assign(S,{phase:'DETECT · MINES',alt:6,spd:0,bat:86,link:'UP',nav:'GNSS',extra:[['VISION',T>1.5?'surface mine':'scanning',T>1.5?'warn':''],['MAGNETOMETER',T>5?'Δ 38 nT':T>4?'Δ 6 nT':'quiet',T>5?'warn':''],['SONAR',T>11.5?'contact 30 m':T>9?'pinging':'stowed',T>11.5?'warn':'']]})}
},
{ id:'thermal', act:'Understand', sky:'day', thermal:true,
  html:`<div class="eyebrow">Thermal triage <span class="act">· PerceptionAgent</span></div>
  <h1>Heat and motion decide <em>who comes first.</em></h1>
  <p>A radiometric thermal camera reads body temperature; tracking over 10–30 s reads motion. Together they sort each person into a START category.</p>
  <table class="tbl"><tr><td style="color:#ff6a7f">Immediate</td><td>Warm, not moving for 10 s, or in water with no flotation</td><td>U = 1.0</td></tr>
  <tr><td style="color:#ff9b3d">Delayed</td><td>Warm, lying or floating, moving</td><td>U = 0.7</td></tr>
  <tr><td style="color:#fff0a0">Minor</td><td>Warm, standing or waving</td><td>U = 0.3</td></tr>
  <tr><td style="color:#9fb7c4">Expectant</td><td>Near water temperature, not moving</td><td>U = 0.1</td></tr></table>`,
  cam:t=>{const a=t*.05; return {pos:V(Math.sin(a)*6-14, 74, -128+Math.cos(a)*4), look:V(-21,0,-212), fov:44}},
  drone:t=>{const p=V(-8+Math.sin(t*.25)*22,MISSION.alt,-188+Math.cos(t*.25)*10); return {pos:p,yaw:-t*.25,pitch:0,roll:-.2,tilt:0,rpm:1,scale:2.4}},
  draw:t=>{for(const e of CAS){const p=e.obj.position; const c=P(p.x,p.y+1.2,p.z); if(!c.ok)continue; const col={IMMEDIATE:C.hazard,DELAYED:C.rescue,MINOR:'#e9d27a',EXPECTANT:C.mist}[e.cat];
    const s=Math.max(16,ppm(p.x,p.z)*2.8); corners(c.x,c.y,s,col); const l2=`${e.temp.toFixed(1)} °C · ${e.warm?(e.cat==='MINOR'?'waving':e.cat==='IMMEDIATE'?'still 14 s':'moving'):'still, cold'}`;
    const lx = c.x+s+190>W-12 ? c.x-s-190 : c.x+s+6; label(lx,c.y-s+10,`${e.label} · ${e.cat}`,col); mono(10);g2.fillStyle=C.foam;g2.fillText(l2,lx+4,c.y-s+27)}},
  hud:t=>{Object.assign(S,{phase:'DETECT · TRIAGE',alt:25,spd:12,bat:84,link:'UP',nav:'GNSS',extra:[['THERMAL','LWIR 640×512','acc'],['WATER TEMP','19.0 °C'],['CASUALTIES','4']]})}
},
{ id:'drift', act:'Understand', sky:'day',
  html:`<div class="eyebrow">Drift prediction <span class="act">· PerceptionAgent</span></div>
  <h1>The sea moves the target. <em>We move with it.</em></h1>
  <p>Every floating track runs a Kalman filter on position and velocity. When the drone looks away, the filter keeps predicting and the uncertainty grows. When it looks back, the estimate snaps tight.</p>
  <div class="formula">v_drift = v_current + k_leeway · v_wind<br>p(t + Δt) = p(t) + v_drift · Δt</div>
  <ul><li><b>Intercept, don't chase.</b> The planner flies to where C2 will be on arrival.</li><li><b>Floating mines drift too.</b> Their exclusion zones move and grow with the filter.</li></ul>`,
  cam:t=>({pos:V(30,72,-180), look:V(32,0,-206), fov:42}),
  drone:t=>{const ph=(t%12); const p=V(32+Math.cos(t*.5)*26, MISSION.alt, -206+Math.sin(t*.5)*18); return {pos:p,yaw:-t*.5,pitch:0,roll:-.25,tilt:0,rpm:1,scale:2}},
  draw:t=>driftLayer(t),
  hud:t=>{const ph=(t%12); Object.assign(S,{phase:'TRACK · C2',alt:25,spd:11,bat:82,link:'UP',nav:'GNSS',extra:[['C2 DRIFT','0.60 m/s · 068°'],['σ POSITION',`${(ph<6?0.6:0.6+(ph-6)*.55).toFixed(1)} m`, ph<6?'good':'warn'],['C2 IN VIEW',ph<6?'YES':'NO']]})}
},
{ act:'Decide', sky:'day',
  html:`<div class="eyebrow">PlannerAgent <span class="act">· decision intelligence</span></div>
  <h1>Urgency first. <em>Never past the battery.</em></h1>
  <div class="formula">S = 0.7 · U · conf + 0.3 · P<br>S = 0 if E(drone→C) + E(C→base, wind) + reserve &gt; E_available</div>
  <ul><li><b>Ranks</b> every confirmed casualty, logs every candidate and why it lost</li><li><b>Plans</b> A* on a 1 m grid around inflated exclusion zones</li><li><b>Intercepts</b> drifting targets at their predicted position</li><li><b>Reroutes</b> instantly on a goal_update from the station</li></ul>`,
  cam:t=>({...TOP(-200,160,42),fov:40}),
  drone:t=>plannerDrone(t),
  draw:t=>plannerLayer(t),
  hud:t=>{Object.assign(S,{phase:t%16<3?'TRIAGE':'NAVIGATE → C1',alt:25,spd:t%16<3?6:14,bat:80-(t%16)*.2,link:'UP',nav:'GNSS',extra:[['TARGET','C1 · S = 0.83','acc'],['PATH','A* · 0 zone entries'],['E_NEED / AVAIL','38 / 61 Wh']]})}
},
{ act:'Decide', sky:'day', dim:.55,
  html:`<div class="eyebrow">Orchestrator <span class="act">· LangGraph, deterministic</span></div>
  <h1>Ten decisions a second. <em>No LLM in the loop.</em></h1>
  <p>The orchestrator is a LangGraph StateGraph over one shared DroneState. Every node is plain Python, so a full tick fits well inside the 100 ms decision budget, and every transition is logged.</p>
  <ul><li><b>Router runs first</b> each tick: MAYDAY → battery → GNSS → link → goal_update → new threat</li><li><b>Reflex layer</b> at 50 Hz keeps it safe in between: avoidance, geofence veto, wind feed-forward</li><li><b>Perception</b> runs asynchronously and never blocks the loop</li></ul>`,
  cam:t=>({...TOP(-205,190,46),fov:40}),
  drone:t=>missionDrone(120+t*SPEED),
  draw:t=>{const s=(120+t*SPEED)%PATH.total; drawSwath(s); drawDetections(s,{labels:false,zones:true}); const d=pathAt(s); drawDroneMark(d.x,d.z,d.yaw); dim(.55); fsmLayer(t)},
  hud:t=>{Object.assign(S,{phase:FSM_SEQ[Math.floor(t/1.6)%FSM_SEQ.length],alt:25,spd:SPEED,bat:78,link:'UP',nav:'GNSS',extra:[['TICK','10 Hz'],['BUDGET','≤ 100 ms decision · ≤ 150 ms total']]})}
},
{ id:'delivery', act:'Act', sky:'day', cut:true,
  html:`<div class="eyebrow">Delivery <span class="act">· NAVIGATE → DELIVER</span></div>
  <h1>A kit lands <em>within reach.</em></h1>
  <p>Over the predicted intercept point the nacelles tilt back to vertical and SKYFORGE descends to 5 m. It releases only when the confirmed track sits within 1.5 m of the drop point. Otherwise it aborts and tries again.</p>
  <ul><li><b>Payload</b> medical kit pod, servo latch, small drag chute</li><li><b>Sea dye</b> marks the spot for the boats that follow</li><li><b>Then</b> back to TRIAGE for the next casualty</li></ul>`,
  cam:t=>{const a=.6+t*.06; const c=casA.obj.position; return {pos:V(c.x+Math.sin(a)*14, 6.5, c.z+Math.cos(a)*14), look:V(c.x, 2.4, c.z), fov:46}},
  drone:t=>deliveryDrone(t),
  draw:t=>deliveryLayer(t),
  hud:t=>{const T=t%16; Object.assign(S,{phase:T<4?'NAVIGATE':T<9.5?'DELIVER':'TRIAGE',alt:T<4?lerp(25,5,ease(T/4)):T<9.5?5:lerp(5,25,ease(clamp((T-9.5)/4,0,1))),spd:T<4?8:0.3,bat:72,link:'UP',nav:'GNSS',extra:[['ROTOR TILT','90° (hover)'],['TRACK TO DROP',T<4?'—':'1.2 m','good'],['KITS LEFT',T<6?'3':'2']]})}
},
{ act:'Survive', sky:'day', cut:true,
  html:`<div class="eyebrow">Resilience <span class="act">· communication module</span></div>
  <h1>Cut the link. Spoof the GPS. <em>Forge an order.</em></h1>
  <ul><li><b>Link lost</b> in a radio shadow: mission continues, every message waits in a 512-slot ring buffer, then replays in order</li>
  <li><b>GNSS spoofed:</b> the jump disagrees with IMU and odometry, so GNSS is rejected and the drone flies on dead reckoning</li>
  <li><b>Forged goal_update:</b> HMAC tag and sequence number don't verify, so it's rejected and logged</li></ul>
  <div class="formula">{"v":1,"seq":1832,"t":"det","id":"C2","c":"injured","u":"DEL","p":[25.4,-208.6,0],"h":"9f2a1c7e4b0d3a11"}  · 142 B</div>`,
  cam:t=>({pos:V(-4,250,95), look:V(0,0,-85), fov:46}),
  drone:t=>resDrone(t),
  draw:t=>resLayer(t),
  hud:t=>{const T=t%20; const lost=T>3&&T<9.5; const sp=T>11&&T<14.5; Object.assign(S,{phase:lost?'EXPLORE · AUTONOMOUS':'EXPLORE',alt:25,spd:15,bat:70,link:lost?'LOST':'UP',nav:sp?'IMU + FLOW':'GNSS',
    extra:[['RING BUFFER',`${lost?Math.floor((T-3)*14):T<11?Math.max(0,Math.floor(91-(T-9.5)*120)):0} / 512`, lost?'acc':''],['FORGED REJECTED',T>15.5?'1':'0',T>15.5?'warn':''],['MSG MAX SIZE','214 B < 1 KB','good']]})}
},
{ act:'Survive', sky:'day', cut:true,
  html:`<div class="eyebrow">Return to home <span class="act">· dynamic threshold</span></div>
  <h1>It always knows <em>the way back.</em></h1>
  <p>Every tick, the planner recomputes the energy needed to fly home against the current headwind, plus landing and a 15 % reserve. When the battery drops below 1.3 × that number, RETURN_BASE is forced, no matter what the mission wants.</p>
  <div class="formula">v_g = v_air − w · û_home<br>E_RTH = P(v, w) · d_home / v_g + E_land + E_reserve</div>`,
  cam:t=>{const d=rthDrone(t).pos; return {pos:V(d.x+5,d.y+2.2,d.z+7.5), look:V(d.x-3.6,d.y-0.9,d.z-4), fov:50}},
  drone:t=>rthDrone(t),
  draw:t=>rthLayer(t),
  hud:t=>{const r=rthState(t); Object.assign(S,{phase:r.forced?'RETURN_BASE':'EXPLORE',alt:30,spd:18,bat:r.bat,link:'UP',nav:'GNSS',extra:[['HEADWIND',`${r.wind.toFixed(1)} m/s`,r.wind>8?'warn':''],['RTH THRESHOLD',`${r.th.toFixed(0)} %`],['DIST TO BASE',`${r.dist.toFixed(0)} m`]]})}
},
{ id:'mayday', act:'Survive', sky:'day', cut:true,
  html:`<div class="eyebrow">MAYDAY <span class="act">· handover</span></div>
  <h1>If it fails, it <em>hands over the mission.</em></h1>
  <p>The health monitor sees the rear motor stop. SKYFORGE-1 sends a MAYDAY carrying a mission snapshot: casualties left, their drift states, exclusion zones and what's been searched. It glides to clear water away from everyone.</p>
  <p>SKYFORGE-2 launches with that snapshot as its starting state, skips the searched lanes and goes straight to TRIAGE.</p>`,
  cam:t=>({pos:V(30,420,40), look:V(0,0,-90), fov:42}),
  drone:t=>maydayDrone1(t),
  draw:t=>maydayLayer(t),
  hud:t=>{const T=t%22; Object.assign(S,{phase:T<2.5?'NAVIGATE':'MAYDAY',alt:T<2.5?25:Math.max(0,25-(T-2.5)*3),spd:T<2.5?15:8,bat:66,link:'UP',nav:'GNSS',extra:[['REAR MOTOR',T<2.5?'OK':'FAULT',T<2.5?'good':'warn'],['SNAPSHOT',T<4?'—':'sent · 3 casualties','acc'],['SKYFORGE-2',T<6?'on pad':'en route','good']]})}
},
{ act:'Machine', sky:'studio', cut:true,
  html:`<div class="eyebrow">The aircraft <span class="act">· from our CAD assembly</span></div>

{ act:'Machine', sky:'day', cut:true, dim:.6,
  html:`<div class="eyebrow">Architecture <span class="act">· ROS 2 Jazzy · Docker</span></div>

  <p>Gazebo and PX4 SITL fly the aircraft. Perception publishes tracks, the LangGraph orchestrator decides, the reflex layer alone commands PX4, and the comm node talks to the station. One launch file starts all of it.</p>

{ id:'close', act:'Return', sky:'dusk', cut:true,
  html:`<div class="eyebrow">19:12 <span class="act">· RETURN_BASE → LANDED</span></div>
  <h1>Back on the pad. <em>Mission logged.</em></h1>
  <p>Four wounded found and ranked, every mine and the patrol boat avoided, three kits delivered, zero zone entries, every decision in mission_logs. Nobody touched the controls.</p>
  <div class="tags" style="color:var(--dim)">SKYFORGE · DRONATHON 3.0 · IEEE AESS/RAS ENSIT · TUNIS</div>`,
  cam:t=>{const d=SLIDES.find(x=>x.id==='close').drone(t).pos; return {pos:V(d.x-5.5, Math.max(d.y+2.6,PAD.y+3), d.z-8.5), look:V(d.x+3.8, d.y-0.9, d.z+4.5), fov:50}},
  drone:t=>{const u=ease(clamp(t/10,0,1)); const a=V(PAD.x+40,30,PAD.z-60); const b=V(PAD.x,HOME.y+6,PAD.z); const c=HOME.clone();
    let p, tilt; if(u<1){p=a.clone().lerp(b,u); tilt=Math.PI/2*smooth(.3,.8,u);} else {const v=ease(clamp((t-10)/4,0,1)); p=b.clone().lerp(c,v); tilt=Math.PI/2;}
    const landed=t>14; return {pos:p,yaw:u<1?Math.atan2(-(b.x-a.x),-(b.z-a.z))*(1-smooth(.6,1,u)):0,pitch:0,roll:0,tilt,rpm:landed?Math.max(0,1-(t-14)/2):1,scale:1}},
  hud:t=>{Object.assign(S,{phase:t<14?'RETURN_BASE':'LANDED',alt:t<10?lerp(28,6,ease(t/10)):Math.max(0,6-(t-10)*1.5),spd:t<10?14:0,bat:31,link:'UP',nav:'GNSS',extra:[['KITS DELIVERED','3','good'],['ZONE ENTRIES','0','good'],['COLLISIONS','0','good']]})}
},
];
const FSM_SEQ=['EXPLORE','DETECT','TRIAGE','NAVIGATE','DELIVER','TRIAGE','NAVIGATE','DELIVER','RETURN_BASE'];

/* ---------------------------------------------------------------- per-slide scene helpers */
/* war zone layer */
function warzoneLayer(t){
  const T=t%16; drawGrid(.08);
  const w=warship.obj.position, wc=P(w.x,w.y+4,w.z), k=ppm(w.x,w.z);
  // lanes, clipped where they enter the conflict zone
  const R=120*smooth(3.5,5,T);
  g2.save(); g2.setLineDash([3,7]); g2.lineWidth=1.2;
  let prev=null; for(const p of PATH){ const q=P(p.x,0,p.z); const inside=Math.hypot(p.x-w.x,p.z-w.z)<R; if(prev){ g2.strokeStyle=inside?'rgba(255,77,87,.75)':'rgba(95,224,210,.55)'; g2.beginPath(); g2.moveTo(prev.x,prev.y); g2.lineTo(q.x,q.y); g2.stroke(); } prev=q; }
  g2.restore();
  // conflict zone
  if(T>3.5){ const c=P(w.x,0,w.z); g2.save(); g2.beginPath(); g2.arc(c.x,c.y,R*k,0,7); const gr=g2.createRadialGradient(c.x,c.y,0,c.x,c.y,R*k); gr.addColorStop(0,'rgba(255,77,87,.20)'); gr.addColorStop(1,'rgba(255,77,87,.06)');
    g2.fillStyle=gr; g2.fill(); g2.setLineDash([12,7]); g2.lineDashOffset=-t*20; g2.strokeStyle='rgba(255,77,87,.9)'; g2.lineWidth=2; g2.stroke(); g2.restore();
    const e=P(w.x,0,w.z+R); label(e.x-120,e.y+20,'CONFLICT ZONE · declared from warship',C.hazard); }
  if(T>4.5){ const q=P(70,0,-232); label(q.x+8,q.y+22,'lanes 5–6 dropped',C.hazard); }
  // warship detection
  if(T>1.2){ const a=clamp((T-1.2)*2,0,1); g2.globalAlpha=a; const s=Math.max(26,k*24); corners(wc.x,wc.y,s,C.hazard,2.2); label(wc.x+s+6,wc.y-s+10,`WARSHIP ${T>2?'0.93':'0.71'} · YOLO11n`,C.hazard); g2.globalAlpha=1;
    if(T<3.2){ const d=drone.root.position, dc=P(d.x,d.y,d.z); g2.save(); g2.setLineDash([2,4]); g2.strokeStyle=C.hazard; g2.beginPath(); g2.moveTo(dc.x,dc.y); g2.lineTo(wc.x,wc.y); g2.stroke(); g2.restore(); } }
  // patrol boat
  const pb=patrol.obj.position; if(T>2.6) dashCircle(pb.x,pb.z,35,'rgba(255,77,87,.7)','rgba(255,77,87,.05)',[8,5]);
  if(T>2.6){ const c=P(pb.x,pb.y,pb.z); corners(c.x,c.y,14,C.hazard,1.6); label(c.x+18,c.y-6,'HOSTILE PATROL · moving zone',C.hazard); }
  // weapon cache
  if(T>6){ const wp=weapon.obj.position, c=P(wp.x,wp.y,wp.z); hatch(wp.x,wp.z,10,C.hazard); corners(c.x,c.y,14,C.hazard,2); label(c.x+18,c.y-6,'WEAPON CACHE 0.89 · vision',C.hazard); }
  const d=drone.root.position; drawDroneMark(d.x,d.z,drone.root.rotation.y);
}
/* mines cross-section */
const MINE_HOVER = V(-170, 6, -120);
function minesLayer(t){
  const T=t%16; const d=drone.root.position; const dc=P(d.x,d.y,d.z); const wl=P(d.x,0,d.z).y;
  const top=wl, bed=H-74; if(bed-top<120) return;
  const depthY = m => top + (bed-top)*Math.pow(m/32,.85);
  // water body
  g2.save(); const gr=g2.createLinearGradient(0,top,0,bed); gr.addColorStop(0,'rgba(18,92,112,.55)'); gr.addColorStop(.5,'rgba(6,40,58,.82)'); gr.addColorStop(1,'rgba(2,12,22,.95)');
  g2.fillStyle=gr; g2.fillRect(0,top,W,bed-top);
  // light shafts
  for(let i=0;i<6;i++){ const x=(i*W/5+t*12)%(W+200)-100; g2.fillStyle='rgba(160,230,240,.04)'; g2.beginPath(); g2.moveTo(x,top); g2.lineTo(x+60,top); g2.lineTo(x+160,bed); g2.lineTo(x+90,bed); g2.fill(); }
  // seabed
  g2.fillStyle='#3a3226'; g2.fillRect(0,bed,W,H-bed); g2.fillStyle='rgba(255,220,160,.08)'; for(let i=0;i<120;i++){ g2.fillRect((i*137.5)%W, bed+3+(i*29)%(H-bed-6), 2, 1); }
  // surface wave line
  g2.strokeStyle='rgba(220,245,250,.8)'; g2.lineWidth=1.4; g2.beginPath(); for(let x=0;x<=W;x+=8){ const y=top+Math.sin(x*.03+t*2)*2.2; x?g2.lineTo(x,y):g2.moveTo(x,y);} g2.stroke();
  // depth ruler
  const rx=W-58; g2.strokeStyle='rgba(233,241,244,.5)'; g2.lineWidth=1; g2.beginPath(); g2.moveTo(rx,top); g2.lineTo(rx,bed); g2.stroke();
  for(const m of [0,5,15,30]){ const y=depthY(m); g2.beginPath(); g2.moveTo(rx-5,y); g2.lineTo(rx+5,y); g2.stroke(); mono(10); g2.fillStyle=C.mist; g2.fillText(`${m} m`, rx+9, y+4); }
  mono(9.5,600); g2.fillStyle=C.mist; g2.fillText('DEPTH', rx-12, top-10);

  if(drone){
    transK = Math.min(1, transK + dt/1.4);
    const k = ease(transK);
    const st=s.drone(t); applyDrone(drone, st, k);
    drone.fault = (SID()==='mayday') && ((t%22)>2.5);
    drone.update(dt,clock);
    if(SID()==='mayday'){ drone2.root.visible=true; applyDrone(drone2, maydayDrone2(t), 1); drone2.update(dt,clock); } else drone2.root.visible=false;
    // camera
    const c=s.cam(t);
    if(k<1 && camFrom){ camera.position.copy(camFrom.pos).lerp(c.pos,k); curLook.copy(camFrom.look).lerp(c.look,k); camera.fov=lerp(camFrom.fov,c.fov||42,k); }
    else { camera.position.copy(c.pos); curLook.copy(c.look); camera.fov=c.fov||42; }
    camera.lookAt(curLook); camera.updateProjectionMatrix();
    // delivery props
    if(SID()==='delivery'){ const T=t%16, ca=casA.obj.position; if(T>5.5&&T<12){ kit.visible=true; const u=clamp((T-5.5)/2.2,0,1); const h=lerp(5.0,ca.y+.1,ease(u)); kit.position.set(ca.x+1.0-u*.2,h,ca.z+.4); kit.getObjectByName('chute').visible=u<1; }
      if(T>7.7){ dye.position.set(ca.x+.6,.32+waveH(ca.x,ca.z,clock)*0,ca.z+.4); const g=clamp((T-7.7)/4,0,1); dye.scale.setScalar(.5+g*5.5); dye.material.opacity=.55*(1-g*.3); } }
  }
  water.position.set(Math.round(camera.position.x/6.8)*6.8,0,Math.round(camera.position.z/6.8)*6.8);
  { const f = camera.position.y>60 ? .00045 : .0016; waterU.uFogD.value=f; scene.fog.density=f; }
  __beacon.material.color.setHex((clock%1.4)<.15?0xff3030:0x401010);
  renderer.render(scene,camera);
  // overlay
  g2.clearRect(0,0,W,H);
  if(s.draw && drone) s.draw(t);
  if(s.hud){ s.hud(t); if(!frame.hudN||frame.hudN++%6===0){ hud.innerHTML=hudRows(); frame.hudN=frame.hudN||1; } }
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------- boot */
resize();
skyNow=skyParams('dawn'); applySky(skyNow,true);
new GLTFLoader().parse(b64ToBuf(window.DRONE_GLB_B64), '', gltf=>{
  const parts={}; gltf.scene.traverse(o=>{ if(o.isMesh){ o.geometry = toCreasedNormals(o.geometry, THREE.MathUtils.degToRad(o.name==='prop'?50:32)); parts[o.name]=o; } });
  // names come from node names; normalise
  for(const k of Object.keys(parts)){ const n=k.replace(/_\d+$/,''); if(!parts[n]) parts[n]=parts[k]; }
  drone=new Drone(parts); scene.add(drone.root);
  drone2=new Drone(parts); scene.add(drone2.root); drone2.root.visible=false;
  drone2.M.body.color.set(0xdfe6ea);
  const m=location.hash.match(/slide-(\d+)/); go(m? +m[1]-1 : 0);
  $('#loading').hidden=true;
  requestAnimationFrame(frame);
}, err=>{ $('#loading').innerHTML='<div><b>SKYFORGE</b>The 3D model could not load. Reload the page.</div>'; console.error(err) });
</script>
